name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    # `labeled` is required for the full-scope gate below to fire when the
    # label is added to an open pull request.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Fast-feedback gate. Runs on every push and pull request.
  # ─────────────────────────────────────────────────────────────────────────
  ci:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        # actions/checkout v6.0.2 (Node.js 24)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        # actions/setup-go v6.4.0 (Node.js 24)
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          # The project is stdlib-only, so there is no go.sum and the module
          # cache would always miss.
          cache: false

      - name: Lint
        # golangci/golangci-lint-action v9.2.1 (Node.js 24). The action runs a
        # full lint pass, so `make lint` is not repeated below.
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee
        with:
          version: latest
          args: --timeout=5m

      - name: Format, vet, mod verify
        run: make check

      - name: Unit and golden tests (race)
        run: make test-race

      - name: Build binary
        run: make build

      - name: Replay every fixture
        run: make replay

      # The dependency rule is a build gate, not a convention.
      - name: Assert zero third-party dependencies
        run: |
          if grep -q '^require' go.mod; then
            echo "go.mod declares a third-party dependency"; exit 1
          fi
          if [ -f go.sum ]; then
            echo "go.sum exists; the project is stdlib-only"; exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Cross-platform full-scope tests.
  # Triggers:
  #   - pull request carrying the `full-test` label
  #   - manual workflow_dispatch
  #   - any push to main
  # ─────────────────────────────────────────────────────────────────────────
  full-scope:
    name: Full-scope (${{ matrix.label }})
    needs: ci
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'full-test')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux/arm64
            os: ubuntu-24.04-arm
          - label: macos/arm64
            os: macos-14
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        # actions/checkout v6.0.2 (Node.js 24)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        # actions/setup-go v6.4.0 (Node.js 24)
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: false

      - name: Format, vet, mod verify
        run: make check

      - name: Unit and golden tests
        run: make test

      - name: Replay every fixture
        run: make replay
