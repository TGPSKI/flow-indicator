name: Bug Report
description: Report a wrong measurement or a crash
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: The command you ran and what it printed or wrote.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What the measurement should have been
      description: Which metric, which turn, and the value you expected.
  - type: textarea
    id: reproduce
    attributes:
      label: Source
      description: >
        The adapter, and the smallest transcript that reproduces it. Redact
        transcript text; a turn's shape usually matters more than its content.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `git rev-parse --short HEAD` or the release tag.
