version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused
  exclusions:
    rules:
      # Defer close / best-effort cleanup: ignoring errors is conventional.
      - linters: [errcheck]
        source: "defer .+\\.Close\\(\\)"
      - linters: [errcheck]
        source: "defer os\\.Remove"
      # fmt.Fprint* to stdout/stderr: write errors are unrecoverable anyway.
      - linters: [errcheck]
        source: "fmt\\.Fprint"
      # Close on an error path, after the error that matters was captured.
      - linters: [errcheck]
        source: "session\\.Close\\(\\)"
      # Best-effort os.Remove and os.WriteFile in tests.
      - linters: [errcheck]
        path: "_test\\.go"
        source: "os\\.(Remove|WriteFile|RemoveAll)"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/TGPSKI/flow-indicator
